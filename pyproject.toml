[project]
name = "llm-trade-negotiation-agents"
version = "1.0.0"
description = "FAANG-level LLM Trade Negotiation System between USA and China agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "config*", "schemas*", "models*", "services*", "utils*", "storage*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "__pycache__", ".mypy_cache", ".ruff_cache", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF", "RET", "ASYNC", "ARG", "DTZ", "TCH", "PERF", "FURB"
]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["agents", "core", "config", "schemas", "models", "services", "utils", "storage", "tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \.venv
  | venv
  | __pycache__
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | \.egg-info
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["agents", "core", "config", "schemas", "models", "services", "utils", "storage", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
show_error_codes = true
pretty = true
namespace_packages = true
packages = [
    "agents",
    "core",
    "config",
    "schemas",
    "models",
    "services",
    "utils",
    "storage",
]
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    "build",
    "dist",
    "site-packages",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --cov=agents --cov=core --cov=config --cov=schemas --cov=models --cov=services --cov=utils --cov=storage --cov-fail-under=95 --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["agents", "core", "config", "schemas", "models", "services", "utils"]
omit = ["tests/*", "*/__pycache__/*", "storage/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
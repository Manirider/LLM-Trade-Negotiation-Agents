name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  OLLAMA_BASE_URL: "http://localhost:11434"
  OLLAMA_MODEL: "llama3.1:8b"
  # Lightweight model for CI integration tests (~400MB vs 5GB)
  OLLAMA_CI_MODEL: "qwen2:0.5b"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Black (format check)
        run: black --check .

      - name: Run isort (import sort check)
        run: isort --check-only .

      - name: Run mypy (type check)
        run: mypy --strict agents core config schemas models services utils storage

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=agents \
            --cov=core \
            --cov=config \
            --cov=schemas \
            --cov=models \
            --cov=services \
            --cov=utils \
            --cov=storage \
            --cov-fail-under=95 \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: llm-trade-negotiation-agents:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d \
            --name test-api \
            -p 8000:8000 \
            -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \
            -e OLLAMA_MODEL=llama3.1:8b \
            llm-trade-negotiation-agents:test

          # Wait for container to start
          sleep 10

          # Test health endpoint
          curl -f http://localhost:8000/health || (docker logs test-api && exit 1)

          # Cleanup
          docker stop test-api

  docker-compose:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    env:
      CI: "true"
      # Use lightweight model for fast CI integration tests (~400MB vs 5GB)
      OLLAMA_MODEL: "qwen2:0.5b"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with docker-compose
        run: |
          docker compose up -d --build

      - name: Wait for API to be healthy
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Test negotiation endpoint
        run: |
          curl -X POST http://localhost:8000/negotiate \
            -H "Content-Type: application/json" \
            -d '{"issue": "Test trade issue", "rounds": 1}' \
            | jq .

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v